<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="./bootstrap.min.css" />
    <script src="./bootstrap.min.js"></script>
    <style>
      td button {
        -webkit-mask-image: url('./checkmark.svg');
        mask-image: url('./checkmark.svg');
        mask-size: 25px !important;
        mask-repeat: no-repeat;
        mask-position: center;
        background-color: green !important;
        min-height: 25px;
        min-width: 25px;
      }
      td.action {
        width: 50px;
      }
      td.center {
        text-align: center
      }
      .hidden {
          display: none !important;
      }
    </style>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  </head>
  <body>

    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" data-page="page-open-tasks" href="#">Open Tasks</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-page="page-create-task" href="#">Create Task</a>
      </li>
    </ul>

    <!-- Page Open Tasks -->
    <div id="page-open-tasks" class="page">
      <table class="table table-striped homey-form-group">
        <thead>
        <tr>
          <th>Title</th>
          <th>Date</th>
          <th>Identifier</th>
          <th>Item</th>
          <th>Label</th>
          <th>Action</th>
        </tr>
        </thead>
        <tbody id="container"></tbody>
      </table>
    </div>

    <!-- Page Create Task -->
    <div class="page hidden" id="page-create-task">
      <fieldset class="homey-form-fieldset">
        <div class="homey-form-group">
          <label class="homey-form-label" for="title">Title</label>
          <input class="homey-form-input" id="title" type="text" value="" />
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="identifier">Identifier</label>
          <select class="homey-form-select" name="select-example" id="identifier">
            <option value="">Create new identifier</option>
          </select>
          <input class="homey-form-input hidden" id="identifier-create" type="text" value="" style="margin-top: 20px"/>
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="item-identifier">Item Identifier (Optional)</label>
          <input class="homey-form-input" id="item-identifier" type="text" value="" />
        </div>
      </fieldset>

      <button id="save" class="homey-button-primary-full is-disabled">Create Task</button>
    </div>

    <script type="text/javascript">
      const $navLinks = document.getElementsByClassName("nav-link");
      for (var i = 0; i < $navLinks.length; i ++) {
        const $navLink = $navLinks[i]
        $navLink.addEventListener("click", () => {

          Array.from(document.getElementsByClassName("nav-link active")).forEach(
              function($oldActiveNavLink, index, array) {
                $oldActiveNavLink.classList.remove("active"); 
              }
          );
          $navLink.classList.add("active");

          Array.from(document.getElementsByClassName("page")).forEach(
              function($page, index, array) {
                if ($page.id == $navLink.dataset.page) {
                  $page.classList.remove("hidden")
                } else {
                  $page.classList.add("hidden")
                }
              }
          );
        });
      }
    </script>

    <script type="text/javascript">
      const uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-5][0-9a-f]{3}-[089ab][0-9a-f]{3}-[0-9a-f]{12}$/;
      const $container = document.getElementById('container');
      function onHomeyReady(Homey) {

        function updateTime() {
          document.querySelectorAll("td.date").forEach(function(task) {
            task.innerHTML = timeSince(task.dataset.date);
          });
        }

        function timeSince(date) {
          var seconds = Math.floor((new Date() - Date.parse(date)) / 1000);
          if (seconds === 0) {
            return Homey.__('now');
          }

          var interval = seconds / 31536000;
          if (interval > 1) {
            const years = Math.floor(interval);
            return (years === 1) ? Homey.__('year', { value: years }) : Homey.__('years', { value: years });
          }
          interval = seconds / 2592000;
          if (interval > 1) {
            const months = Math.floor(interval);
            return (months === 1) ? Homey.__('month', { value: months }) : Homey.__('months', { value: months });
          }
          interval = seconds / 86400;
          if (interval > 1) {
            const days = Math.floor(interval);
            return (days === 1) ? Homey.__('day', { value: days }) : Homey.__('days', { value: days });
          }
          interval = seconds / 3600;
          if (interval > 1) {
            const hours = Math.floor(interval);
            return (hours === 1) ? Homey.__('hour', { value: hours }) : Homey.__('hours', { value: hours });
          }
          interval = seconds / 60;
          if (interval > 1) {
            const minutes = Math.floor(interval);
            return (minutes === 1) ? Homey.__('minute', { value: minutes }) : Homey.__('minutes', { value: minutes });
          }
          return (seconds === 1) ? Homey.__('second', { value: seconds }) : Homey.__('seconds', { value: seconds });
        }

        function loadIdentifiers() {
          const $titleInputField = document.getElementById('title');
          const $selectIdentifiers = document.getElementById('identifier');
          const $createInputField = document.getElementById('identifier-create');
          const $itemIdentifier = document.getElementById('item-identifier');

          Promise.resolve().then(async () => {
            $titleInputField.value = '';
            $createInputField.value = '';
            $itemIdentifier.value = '';

            const identifiers = await Homey.api('GET', '/identifiers');

            $selectIdentifiers.innerHTML = '';
            $noOption = document.createElement('option');
            $noOption.innerHTML = '-';
            $noOption.value = '-';
            $selectIdentifiers.appendChild($noOption);

            for (const identifier of identifiers) {
              $option = document.createElement('option');
              $option.value = identifier
              $option.innerHTML = identifier;
              $selectIdentifiers.appendChild($option);
            }

            $newOption = document.createElement('option');
            $newOption.innerHTML = 'Create new identifier';
            $newOption.value = '';
            $selectIdentifiers.appendChild($newOption);

            if (identifiers.length === 0) {
                $createInputField.classList.remove("hidden"); 
            }
          })
          .catch(err => {
            console.log(err);
          })
          .finally();
        }

        function initialize() {
          const $titleInputField = document.getElementById('title');
          const $selectIdentifiers = document.getElementById('identifier');
          const $createInputField = document.getElementById('identifier-create');
          const $itemIdentifier = document.getElementById('item-identifier');
          const $saveButton = document.getElementById('save');

          /* Load Identifiers */
          loadIdentifiers();

          /* Show / Hide create identifier field */
          $selectIdentifiers.addEventListener("change", function() {
            if ($selectIdentifiers.value == "") {
              $createInputField.classList.remove("hidden"); 
            } else {
              $createInputField.classList.add("hidden"); 
            }
            validateForm();
          });

          /* Observe Value */
          $createInputField.addEventListener("input", function() {
            validateForm();
          });

          $titleInputField.addEventListener("input", function() {
            validateForm();
          });

          function validateForm() {
            const title = $titleInputField.value.trim();
            const identifier = ($selectIdentifiers.value == "") ? $createInputField.value.trim() : $selectIdentifiers.value;
            const isValid = (title != "" && identifier != "");
            if (isValid) {
              $saveButton.classList.remove("is-disabled")
            } else {
              $saveButton.classList.add("is-disabled")
            }
          }

          /* Save */
          $saveButton.addEventListener("click", async () => {
            const title = $titleInputField.value.trim();
            const identifier = ($selectIdentifiers.value == "") ? $createInputField.value.trim() : ($selectIdentifiers.value == "-") ? undefined : $selectIdentifiers.value;
            const itemIdentifier = ($itemIdentifier.value.trim() == "") ? undefined : $itemIdentifier.value.trim();
            await Homey.api('POST', '/task', {'title': title, 'identifier': identifier, 'item': itemIdentifier});
            loadIdentifiers();
          });

          reload();
        }

        function reload() {

          /* Load Tasks */
          Promise.resolve().then(async () => {
            const tasks = await Homey.api('GET', '/tasks');
            $container.innerHTML = '';
            if (tasks.length === 0) {
              throw new Error(Homey.__('noOpenTasks'));
            }

            for (const task of Object.values(tasks)) {
              const $task = document.createElement('tr');

              $title = document.createElement('td');
              $title.classList.add('title');
              $title.innerHTML = task.title;
              $task.appendChild($title);
              
              $date = document.createElement('td');
              $date.classList.add('date');
              $date.innerHTML = timeSince(task.date);
              const $dateAttribute = document.createAttribute("data-date");
              $dateAttribute.value = task.date
              $date.setAttributeNode($dateAttribute);
              $task.appendChild($date);

              $identifier = document.createElement('td');
              $identifier.innerHTML = uuidRegex.test(task.identifier) ? '-' : task.identifier;
              $task.appendChild($identifier);

              $item = document.createElement('td');
              $item.innerHTML = task.item !== undefined ? task.item : "-";
              $task.appendChild($item);

              $tag = document.createElement('td');
              $tag.innerHTML = task.tag !== undefined ? task.tag : "-";
              $task.appendChild($tag);

              $action = document.createElement('td');
              $action.classList.add('action');
              $task.appendChild($action);

              $button = document.createElement('button');
              $action.appendChild($button);

              $button.addEventListener('click', async () => {
                if (task.item === undefined) {
                  await Homey.api('DELETE', '/task/' + task.identifier, {});
                } else {
                  await Homey.api('DELETE', '/task/' + task.identifier + '/' + task.item, {});
                }
              });
              
              $container.appendChild($task);
            }
          })
          .catch(err => {
            const $task = document.createElement('tr');
            $title = document.createElement('td');
            $title.classList.add('center');
            const $colspanAttribute = document.createAttribute("colspan");
            $colspanAttribute.value = '6';
            $title.setAttributeNode($colspanAttribute);
            $title.innerHTML = err.message;
            $container.appendChild($title);
          })
          .finally();
        }

        Homey.on('didUpdateTasks', (event) => {
          reload();
        });

        Homey.ready();
        initialize();
        setInterval(updateTime, 1000); 
      }
    </script>
  </body>
</html>
