<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" type="text/css" href="./bootstrap.min.css" />
    <script src="./bootstrap.min.js"></script>
    <style>
      td a {
          cursor: pointer;
          display: inherit;
          height: 35px;
          width: 35px;
          border-radius: 17.5px;
          padding: 7.5px;
      }
      td span.spacer {
          display: inherit;
          width: 5px;
      }
      td a span {
          display: block;
          mask-size: 20px;
          mask-size: auto;
          mask-repeat: no-repeat;
          mask-position: center;
          min-height: 20px;
          min-width: 20px;
      }
      td a.checkmark {
          background-color: darkblue;
      }
      td a.checkmark span {
          -webkit-mask-image: url('./checkmark.svg');
          mask-image: url('./checkmark.svg');
          background-color: white;
      }
      td a.trash {
          background-color: darkred;
      }
      td a.trash span {
          -webkit-mask-image: url('./trash.svg');
          mask-image: url('./trash.svg');
          background-color: white;
      }
      td a.lock {
          background-color: darkred;
      }
      td a.lock span {
          -webkit-mask-image: url('./lock.closed.svg');
          mask-image: url('./lock.closed.svg');
          background-color: white;
      }
      td a.unlock {
          background-color: green;
      }
      td a.unlock span {
          -webkit-mask-image: url('./lock.open.svg');
          mask-image: url('./lock.open.svg');
          background-color: white;
      }
      td.action {
        width: 96px;
      }
      td.center {
        text-align: center
      }
      .hidden {
          display: none !important;
      }
      .section {
        padding-top: 20px;
        margin: 0;
      }
      .linebreak {
        margin: 0;
      }
      h2 {
        font-size: var(--homey-font-size-default) !important;
        font-weight: var(--homey-font-weight-regular) !important;
        margin-top: var(--homey-su-2) !important;
        margin-bottom: var(--homey-su-1) !important;
      }
      input.homey-form-input[type="datetime-local"] {
        width: calc( 100% - 2px );
        appearance: none;
        display: block;
        box-sizing: border-box;
        margin: 0 1px;
        background: var(--homey-color-component);
        padding: var(--homey-su-1);
        border-radius: var(--homey-border-radius-small);
        font-size: var(--homey-font-size-default);
        line-height: 24px;
        color: var(--homey-color-text);
        border: none;
        box-shadow: 0 0 0 1px var(--homey-color-line);
        transition: var(--homey-duration-fast) var(--homey-curve-fast-in);
        transition-property: box-shadow, color;
        -webkit-tap-highlight-color: transparent;
        text-align: start;
      }
    </style>
    <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  </head>
  <body>

    <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" data-page="page-about-tasks" href="#" data-i18n="settings.tab.about"></a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-page="page-list-tasks" href="#" data-i18n="settings.tab.list"></a>
      </li>
      <li class="nav-item">
        <a class="nav-link" data-page="page-create-task" href="#" data-i18n="settings.tab.create"></a>
      </li>
      <!-- <li class="nav-item">
        <a class="nav-link" data-page="page-history" href="#" data-i18n="settings.tab-history"></a>
      </li> -->
    </ul>

    <!-- Page About -->
    <div class="page" id="page-about-tasks">
      
      <p data-i18n="settings.about.section1.item1" class="section"></p>
      <p data-i18n="settings.about.section1.item2" class="linebreak"></p>

      <p data-i18n="settings.about.section2.item1" class="section"></p>
      <p data-i18n="settings.about.section2.item2" class="linebreak"></p>
      <p data-i18n="settings.about.section2.item3" class="linebreak"></p>
    </div>

    <!-- Page List Tasks -->
    <div class="page hidden" id="page-list-tasks">

      <h2>Open tasks</h2>
      <table class="table table-striped homey-form-group" style="margin-top: 0">
        <thead>
        <tr>
          <th data-i18n="settings.list.title"></th>
          <th data-i18n="settings.list.date"></th>
          <th data-i18n="settings.list.identifier"></th>
          <th data-i18n="settings.list.item"></th>
          <th data-i18n="settings.list.tag"></th>
          <th data-i18n="settings.list.action"></th>
        </tr>
        </thead>
        <tbody id="open-container"></tbody>
      </table>

      <h2>Future tasks</h2>
      <table class="table table-striped homey-form-group" style="margin-top: 0">
        <thead>
        <tr>
          <th data-i18n="settings.list.title"></th>
          <th data-i18n="settings.list.date"></th>
          <th data-i18n="settings.list.identifier"></th>
          <th data-i18n="settings.list.item"></th>
          <th data-i18n="settings.list.tag"></th>
          <th data-i18n="settings.list.action"></th>
        </tr>
        </thead>
        <tbody id="future-container"></tbody>
      </table>

    <!-- Page Create Task -->
    <div class="page hidden" id="page-create-task">
      <fieldset class="homey-form-fieldset">
        <div class="homey-form-group">
          <label class="homey-form-label" for="title" data-i18n="settings.create.title"></label></label>
          <input class="homey-form-input" id="title" type="text" value="" />
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="scheduleDate" data-i18n="settings.create.schedule"></label>
          <select class="homey-form-select" id="scheduleDate">
            <option value="0" data-i18n="settings.create.scheduleNow"></option>
            <option value="1" data-i18n="settings.create.scheduleFuture"></option>
          </select>
          <input class="homey-form-input hidden" id="futureDate" type="datetime-local" value="" style="margin-top: 20px"/>
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="identifier" data-i18n="settings.create.identifier"></label>
          <select class="homey-form-select" id="identifier"></select>
          <input class="homey-form-input hidden" id="identifier-create" type="text" value="" style="margin-top: 20px"/>
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="item-identifier" data-i18n="settings.create.item"></label>
          <input class="homey-form-input" id="item-identifier" type="text" value="" />
        </div>
        <div class="homey-form-group">
          <label class="homey-form-label" for="tag" data-i18n="settings.create.tag"></label>
          <select class="homey-form-select" id="tag"></select>
          <input class="homey-form-input hidden" id="tag-create" type="text" value="" style="margin-top: 20px"/>
        </div>
      </fieldset>

      <button id="save" class="homey-button-primary-full is-disabled" data-i18n="settings.create.save"></button>
    </div>

    <!-- Page Create Task -->
    <div class="page hidden" id="page-history">

    </div>

    <script type="text/javascript">
      const $navLinks = document.getElementsByClassName("nav-link");
      for (var i = 0; i < $navLinks.length; i ++) {
        const $navLink = $navLinks[i]
        $navLink.addEventListener("click", () => {

          Array.from(document.getElementsByClassName("nav-link active")).forEach(
              function($oldActiveNavLink, index, array) {
                $oldActiveNavLink.classList.remove("active"); 
              }
          );
          $navLink.classList.add("active");

          Array.from(document.getElementsByClassName("page")).forEach(
              function($page, index, array) {
                if ($page.id == $navLink.dataset.page) {
                  $page.classList.remove("hidden")
                } else {
                  $page.classList.add("hidden")
                }
              }
          );
        });
      }
    </script>

    <script type="text/javascript">
      const $openContainer = document.getElementById('open-container');
      const $futureContainer = document.getElementById('future-container');
      function onHomeyReady(Homey) {

        function getMinDate() {
           const minDate = new Date();
          minDate.setMinutes(minDate.getMinutes() + 1);

          const yyyy = minDate.getFullYear();
          const mm = String(minDate.getMonth() + 1).padStart(2, '0');
          const dd = String(minDate.getDate()).padStart(2, '0');
          const hh = String(minDate.getHours()).padStart(2, '0');
          const min = String(minDate.getMinutes()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
        }

        function getExampleFutureDate() {
           const minDate = new Date();
          minDate.setHours(minDate.getHours() + 1);

          const yyyy = minDate.getFullYear();
          const mm = String(minDate.getMonth() + 1).padStart(2, '0');
          const dd = String(minDate.getDate()).padStart(2, '0');
          const hh = String(minDate.getHours()).padStart(2, '0');
          const min = String(minDate.getMinutes()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
        }

        function updateTime() {
          document.querySelectorAll("td.date").forEach(function(task) {
            task.innerHTML = timeSince(task.dataset.date);
          });
        }

        function timeSince(date) {

          const TIME_UNITS = [
            [31536000, 'year', 'years'],
            [2592000, 'month', 'months'],
            [86400, 'day', 'days'],
            [3600, 'hour', 'hours'],
            [60, 'minute', 'minutes'],
          ];

          const diffMs = Date.now() - Date.parse(date);
          const isFuture = diffMs < 0;
          const seconds = Math.floor(Math.abs(diffMs) / 1000);

          if (seconds === 0) {
            return Homey.__('now');
          }

          for (const [unitSeconds, singular, plural] of TIME_UNITS) {
            const interval = seconds / unitSeconds;
            if (interval >= 1) {
              const value = Math.floor(interval);
              const key = value === 1 ? singular : plural;
              return Homey.__(isFuture ? `time.from.${key}` : `time.untill.${key}`, { value });
            }
          }

          const key = seconds === 1 ? 'second' : 'seconds';
          return Homey.__(isFuture ? `time.from.${key}` : `time.untill.${key}`, { value: seconds });
        }

        function clear() {
          document.getElementById('title').value = '';
          document.getElementById('identifier').innerHTML = '';
          document.querySelector("#scheduleDate option[value='0']").selected = true;
          document.getElementById('futureDate').value = '';
          document.getElementById('futureDate').classList.add("hidden"); 
          document.getElementById('identifier-create').value = '';
          document.getElementById('item-identifier').value = '';
          document.getElementById('tag').innerHTML = '';
          document.getElementById('tag-create').value = '';
          document.getElementById('tag-create').classList.add("hidden"); 
        }

        function loadIdentifiers() {
          const $selectIdentifiers = document.getElementById('identifier');
          const $createIdentifier = document.getElementById('identifier-create');

          Promise.resolve().then(async () => {
            $createIdentifier.value = '';

            const identifiers = await Homey.api('GET', '/identifiers');

            $selectIdentifiers.innerHTML = '';
            $noOption = document.createElement('option');
            $noOption.innerHTML = '-';
            $noOption.value = '-';
            $selectIdentifiers.appendChild($noOption);

            for (const identifier of identifiers) {
              $option = document.createElement('option');
              $option.value = identifier
              $option.innerHTML = identifier;
              $selectIdentifiers.appendChild($option);
            }

            $newOption = document.createElement('option');
            $newOption.innerHTML = Homey.__('newIdentifier');
            $newOption.value = '';
            $selectIdentifiers.appendChild($newOption);
          })
          .catch(err => {
            console.log(err);
          })
          .finally();
        }

        function loadTags() {
          const $selectTags = document.getElementById('tag');
          const $createTag = document.getElementById('tag-create');

          Promise.resolve().then(async () => {
            $createTag.value = '';

            const labels = await Homey.api('GET', '/tags');

            $selectTags.innerHTML = '';
            $noOption = document.createElement('option');
            $noOption.innerHTML = '-';
            $noOption.value = '-';
            $selectTags.appendChild($noOption);

            for (const label of labels) {
              $option = document.createElement('option');
              $option.value = label
              $option.innerHTML = label;
              $selectTags.appendChild($option);
            }

            $newOption = document.createElement('option');
            $newOption.innerHTML = Homey.__('newTag');
            $newOption.value = '';
            $selectTags.appendChild($newOption);
          })
          .catch(err => {
            console.log(err);
          })
          .finally();
        }

        function initialize() {
          const $titleInputField = document.getElementById('title');
          const $selectIdentifiers = document.getElementById('identifier');
          const $createIdentifier = document.getElementById('identifier-create');
          const $scheduleDate = document.getElementById('scheduleDate');
          const $futureDate = document.getElementById('futureDate');
          const $itemIdentifier = document.getElementById('item-identifier');
          const $selectTags = document.getElementById('tag');
          const $createTag = document.getElementById('tag-create');
          const $saveButton = document.getElementById('save');

          /* Load Identifiers and tags */
          clear();
          loadIdentifiers();
          loadTags();

          /* Show / Hide create identifier field */
          $selectIdentifiers.addEventListener("change", function() {
            if ($selectIdentifiers.value == "") {
              $createIdentifier.classList.remove("hidden"); 
            } else {
              $createIdentifier.classList.add("hidden"); 
            }
            validateForm();
          });

          /* Show / Hide create date field */
          $scheduleDate.addEventListener("change", function() {
            if ($scheduleDate.value === "1") {
              $futureDate.classList.remove("hidden"); 
              $futureDate.min = getMinDate();
              if ($futureDate.value == '') {
                $futureDate.value = getExampleFutureDate();
              }
            } else {
              $futureDate.classList.add("hidden"); 
            }
            validateForm();
          });

          /* Show / Hide create tag field */
          $selectTags.addEventListener("change", function() {
            if ($selectTags.value == "") {
              $createTag.classList.remove("hidden"); 
            } else {
              $createTag.classList.add("hidden"); 
            }
            validateForm();
          });

          /* Observe Value */
          $createIdentifier.addEventListener("input", function() {
            validateForm();
          });

          $futureDate.addEventListener("input", function() {
            validateForm();
          });

          $createTag.addEventListener("input", function() {
            validateForm();
          });

          $titleInputField.addEventListener("input", function() {
            validateForm();
          });

          function validateForm() {
            const now = new Date();
            const title = $titleInputField.value.trim();
            const identifier = ($selectIdentifiers.value === "") ? $createIdentifier.value.trim() : $selectIdentifiers.value;
            const selectedDate = $scheduleDate.value === "0" ? new Date() : new Date($futureDate.value);

            // if (selectedDate < now) {
            //   $futureDate.setCustomValidity('Please select a future date and time.');
            // } else {
            //   $futureDate.setCustomValidity('');
            // }
            // $futureDate.reportValidity();

            const isValid = (title != "" && identifier != "" && selectedDate >= now);
            if (isValid) {
              $saveButton.classList.remove("is-disabled")
            } else {
              $saveButton.classList.add("is-disabled")
            }
          }

          /* Save */
          $saveButton.addEventListener("click", async () => {
            if ($saveButton.classList.contains("is-disabled")) {
              return;
            }
            const title = $titleInputField.value.trim();
            const identifier = ($selectIdentifiers.value === "") ? $createIdentifier.value.trim() : ($selectIdentifiers.value === "-") ? undefined : $selectIdentifiers.value;
            const tag = ($selectTags.value === "") ? $createTag.value.trim() : ($selectTags.value === "-") ? undefined : $selectTags.value;
            const itemIdentifier = ($itemIdentifier.value.trim() === "") ? undefined : $itemIdentifier.value.trim();
            const date = ($scheduleDate.value === "1") ? new Date($futureDate.value) : new Date();
            await Homey.api('POST', '/task', {'title': title, 'date': date.getTime(), 'identifier': identifier, 'item': itemIdentifier, 'tag': tag});
            clear();
            loadIdentifiers();
            loadTags();
          });

          reload();
        }

        function reload() {

          /* Load Tasks */
          Promise.resolve().then(async () => {
            const tasks = await Homey.api('GET', '/tasks');
            $openContainer.innerHTML = '';
            $futureContainer.innerHTML = '';

            for (const task of Object.values(tasks)) {
              const $task = document.createElement('tr');

              $title = document.createElement('td');
              $title.classList.add('title');
              $title.innerHTML = task.title;
              $task.appendChild($title);
              
              $date = document.createElement('td');
              $date.classList.add('date');
              $date.innerHTML = timeSince(task.date);
              const $dateAttribute = document.createAttribute("data-date");
              $dateAttribute.value = task.date
              $date.setAttributeNode($dateAttribute);
              $task.appendChild($date);

              $identifier = document.createElement('td');
              $identifier.innerHTML = task.identifier !== undefined ? task.identifier : "-";
              $task.appendChild($identifier);

              $item = document.createElement('td');
              $item.innerHTML = task.item !== undefined ? task.item : "-";
              $task.appendChild($item);

              $tag = document.createElement('td');
              $tag.innerHTML = task.tag !== undefined ? task.tag : "-";
              $task.appendChild($tag);

              $action = document.createElement('td');
              $action.classList.add('action');
              $task.appendChild($action);

              if (task.locked) {

                $lock = document.createElement('a');
                $lock.title = Homey.__('settings.list.actions.lock');
                $lock.classList.add('lock');
                $action.appendChild($lock);
                $lockMask = document.createElement('span');
                $lock.appendChild($lockMask);
                $lock.addEventListener('click', async () => {
                  const parameters = new URLSearchParams();
                  parameters.set('id', task._id);

                  const query = parameters.size > 0 ? `?${parameters}` : '';
                  await Homey.api('POST', `/unlock${query}`, {});
                });
                
              } else {
                
                $unlock = document.createElement('a');
                $unlock.title = Homey.__('settings.list.actions.unlock');
                $unlock.classList.add('unlock');
                $action.appendChild($unlock);
                $unlockMask = document.createElement('span');
                $unlock.appendChild($unlockMask);
                $unlock.addEventListener('click', async () => {
                  const parameters = new URLSearchParams();
                  parameters.set('id', task._id);

                  const query = parameters.size > 0 ? `?${parameters}` : '';
                  await Homey.api('POST', `/lock${query}`, {});
                });

                switch (task.state) {
                  case 'open':

                    $spacer = document.createElement('span');
                    $spacer.classList.add('spacer');
                    $action.appendChild($spacer);

                    $check = document.createElement('a');
                    $check.title = Homey.__('settings.list.actions.complete');
                    $check.classList.add('checkmark');
                    $action.appendChild($check);
                    $checkMask = document.createElement('span');
                    $check.appendChild($checkMask);
                    $check.addEventListener('click', async () => {
                      const parameters = new URLSearchParams();
                      parameters.set('id', task._id);
                      
                      const query = parameters.size > 0 ? `?${parameters}` : '';
                      await Homey.api('POST', `/complete${query}`, {});
                    });

                    break;
                  case 'future':

                    $spacer = document.createElement('span');
                    $spacer.classList.add('spacer');
                    $action.appendChild($spacer);

                    $delete = document.createElement('a');
                    $delete.title = Homey.__('settings.list.actions.delete');
                    $delete.classList.add('trash');
                    $action.appendChild($delete);
                    $deleteMask = document.createElement('span');
                    $delete.appendChild($deleteMask);
                    $delete.addEventListener('click', async () => {
                      const parameters = new URLSearchParams();
                      parameters.set('id', task._id);
                      
                      const query = parameters.size > 0 ? `?${parameters}` : '';
                      await Homey.api('DELETE', `/task${query}`, {});
                    });

                    break;
                  case 'closed':
                    break;

                }
              }
              
              if (task.state === 'future') {
                $futureContainer.appendChild($task);
              } else if (task.state === 'open') {
                $openContainer.appendChild($task);
              }
            }

            if ($openContainer.children.length === 0) {
              const $task = document.createElement('tr');
              $title = document.createElement('td');
              $title.classList.add('center');
              const $colspanAttribute = document.createAttribute("colspan");
              $colspanAttribute.value = '6';
              $title.setAttributeNode($colspanAttribute);
              $title.innerHTML = Homey.__('noOpenTasks');
              $openContainer.appendChild($title);
            }

            if ($futureContainer.children.length === 0) {
              const $task = document.createElement('tr');
              $title = document.createElement('td');
              $title.classList.add('center');
              const $colspanAttribute = document.createAttribute("colspan");
              $colspanAttribute.value = '6';
              $title.setAttributeNode($colspanAttribute);
              $title.innerHTML = Homey.__('noFutureTasks');
              $futureContainer.appendChild($title);
            }
          })
          .finally();
        }

        Homey.on('didUpdateTasks', (event) => {
          console.log('didUpdateTasks');
          reload();
        });

        Homey.ready();
        initialize();
        setInterval(updateTime, 1000); 
      }
    </script>
  </body>
