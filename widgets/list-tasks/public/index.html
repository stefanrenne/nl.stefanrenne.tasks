<html>
  <head>
    <style>
      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      li.task {
        border-top: var(--homey-line-light);
        border-left: var(--homey-line-light);
        border-right: var(--homey-line-light);
        background-color: var(--homey-background-color);
        padding: var(--homey-su-1) var(--homey-su-2) var(--homey-su-1);
        position: relative;
      }
      li.task p {
        padding-right: 35px;
      }
      li:first-child {
        border-top-left-radius: var(--homey-border-radius-default);
        border-top-right-radius: var(--homey-border-radius-default);
      }
      li:last-child {
        border-bottom-left-radius: var(--homey-border-radius-default);
        border-bottom-right-radius: var(--homey-border-radius-default);
        border-bottom: var(--homey-line-light);
      }
      .homey-custom-icon-checkmark {
        position: absolute;
        --homey-icon-color: var(--homey-icon-color-green);
        --homey-icon-size: var(--homey-icon-size-medium);
        -webkit-mask-image: url('./checkmark.svg');
        mask-image: url('./checkmark.svg');
        top: 0;
        right: var(--homey-su-4);
        height: 100%;
        mask-size: contain;
        mask-position: center;
      }
    </style>
  </head>

  <body class="homey-widget-full">
    <div id="container"></div>

    <script type="text/javascript">
      const $container = document.getElementById('container');
      function onHomeyReady(Homey) {

        function updateTime() {
          document.querySelectorAll("li p.date").forEach(function(task) {
            var text = timeSince(task.dataset.date);
            if (Homey.getSettings()['showTag'] == true && task.dataset.tag !== undefined) {
              text += " | " + task.dataset.tag;
            }
            task.innerHTML = text;
          });
        }

        function timeSince(date) {

          const TIME_UNITS = [
            [31536000, 'year', 'years'],
            [2592000, 'month', 'months'],
            [86400, 'day', 'days'],
            [3600, 'hour', 'hours'],
            [60, 'minute', 'minutes'],
          ];

          const diffMs = Date.now() - Date.parse(date);
          const isFuture = diffMs < 0;
          const seconds = Math.floor(Math.abs(diffMs) / 1000);

          if (seconds === 0) {
            return Homey.__('now');
          }

          for (const [unitSeconds, singular, plural] of TIME_UNITS) {
            const interval = seconds / unitSeconds;
            if (interval >= 1) {
              const value = Math.floor(interval);
              const key = value === 1 ? singular : plural;
              return Homey.__(isFuture ? `time.from.${key}` : `time.untill.${key}`, { value });
            }
          }

          const key = seconds === 1 ? 'second' : 'seconds';
          return Homey.__(isFuture ? `time.from.${key}` : `time.untill.${key}`, { value: seconds });
        }

        function reload() {
          Promise.resolve().then(async () => {
            const tag = Homey.getSettings()['tag'];

            const parameters = new URLSearchParams();
            parameters.set('future', 'false');
            if (tag !== undefined && typeof tag['name'] !== 'undefined' && tag['name'] !== "-") {
              parameters.set('tag', tag['name']);
            }

            const query = parameters.size > 0 ? `?${parameters}` : '';
            const tasks = await Homey.api('GET', `/tasks${query}`, {});
            $container.innerHTML = '';
            if (tasks.length === 0) {
              throw new Error(Homey.__('noOpenTasks'));
            }
            const $tasks = document.createElement('ul');
            $container.appendChild($tasks);

            for (const task of Object.values(tasks)) {
              const $task = document.createElement('li');
              $task.classList.add('task');

              $title = document.createElement('p');
              $title.classList.add('homey-text-medium');
              $title.innerHTML = task.title;
              $task.appendChild($title);
              
              $body = document.createElement('p');
              $body.classList.add('homey-text-small-light');
              $body.classList.add('date');

              var text = timeSince(task.date);
              if (Homey.getSettings()['showTag'] == true && task.tag !== undefined) {
                text += " | " + task.tag;
              }
              $body.innerHTML = text;

              const $dateAttribute = document.createAttribute("data-date");
              $dateAttribute.value = task.date
              $body.setAttributeNode($dateAttribute);
              if (task.tag !== undefined) {
                const $tagAttribute = document.createAttribute("data-tag");
                $tagAttribute.value = task.tag
                $body.setAttributeNode($tagAttribute);
              }
              $task.appendChild($body);

              if (!task.locked) {
                $icon = document.createElement('div');
                $icon.classList.add('homey-custom-icon-checkmark');
                $task.appendChild($icon);

                $icon.addEventListener('click', async () => {
                  Homey.hapticFeedback();

                  const parameters = new URLSearchParams();
                  parameters.set('id', task._id);

                  const query = parameters.size > 0 ? `?${parameters}` : '';
                  await Homey.api('POST', `/complete${query}`, {});
                });
              }
              
              $tasks.appendChild($task);
            }
            Homey.setHeight($container.offsetHeight);
          })
          .catch(err => {
            const $task = document.createElement('li');

            $title = document.createElement('p');
            $title.classList.add('homey-text-regular');
            $title.innerHTML = err.message;
            $container.appendChild($title);
            Homey.setHeight($container.offsetHeight);
          })
          .finally();
        }

        Homey.on('didUpdateTasks', (event) => {
          reload();
        });

        Homey.ready();
        reload();
        setInterval(updateTime, 1000); 
      }
    </script>
  </body>
</html>
